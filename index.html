<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ananaya Jain — RX Desk</title>
<meta name="description" content="RX Desk — restructuring updates and market opinions by Ananaya Jain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237f97aa'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='Times New Roman,serif' fill='%23faf6ee'>R</text></svg>">
<style>
  :root{
    --bg:#8298aa;
    --bg-top:#90a6b7;
    --bg-bottom:#7b8fa0;
    --tile:#fbf8f1;
    --tile-hover:#fffdf8;
    --ink:#23211e;
    --ink-soft:#4f4a43;
    --rule:#e0d7c6;
    --chip:#f0e8d8;
    --chip-ink:#4a4238;
    --chip-year:#dfe6ec;
    --accent:#a98a63;
    --panel:rgba(255,255,255,.13);
    --panel-line:rgba(255,255,255,.22);
    --shadow:0 2px 5px rgba(28,34,42,.14), 0 12px 28px rgba(28,34,42,.18);
    --shadow-lift:0 5px 10px rgba(28,34,42,.16), 0 20px 44px rgba(28,34,42,.24);
    --r-tile:16px;
    --r-panel:22px;
    --serif:"Times New Roman", Times, "Liberation Serif", serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100%;
    background:
      radial-gradient(1100px 620px at 18% -6%, rgba(242,220,186,.32), transparent 62%),
      radial-gradient(900px 520px at 92% 8%, rgba(236,210,176,.22), transparent 60%),
      linear-gradient(168deg, var(--bg-top) 0%, var(--bg) 52%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    font-family:var(--serif);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }

  /* ---------- decorative background tiles ---------- */
  .bgtiles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgtiles i{
    position:absolute;display:block;border-radius:26px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.075);
  }
  .bgtiles i.warm{background:rgba(238,219,190,.085);border-color:rgba(238,219,190,.11)}
  .bgtiles i.deep{background:rgba(44,58,72,.055);border-color:rgba(44,58,72,.06)}
  .bgtiles i:nth-child(1){width:330px;height:330px;top:-90px;left:-110px;transform:rotate(-8deg)}
  .bgtiles i:nth-child(2){width:180px;height:180px;top:16%;right:-60px;transform:rotate(11deg)}
  .bgtiles i:nth-child(3){width:260px;height:150px;top:47%;left:-90px;transform:rotate(6deg)}
  .bgtiles i:nth-child(4){width:120px;height:120px;top:64%;right:8%;transform:rotate(-14deg)}
  .bgtiles i:nth-child(5){width:420px;height:230px;bottom:-110px;right:-120px;transform:rotate(-5deg)}
  .bgtiles i:nth-child(6){width:96px;height:96px;top:33%;left:6%;transform:rotate(18deg)}
  @media(max-width:760px){.bgtiles i:nth-child(3),.bgtiles i:nth-child(6){display:none}}

  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 24px 88px}

  /* ---------- nav ---------- */
  nav.top{display:flex;gap:10px;align-items:center;padding:22px 0 0}
  nav.top a{
    font-size:14.5px;letter-spacing:.07em;text-transform:uppercase;
    color:#eef3f7;text-decoration:none;
    padding:7px 15px;border-radius:999px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    transition:background .16s ease, color .16s ease;
  }
  nav.top a:hover{background:rgba(255,255,255,.19)}
  nav.top a.active{background:rgba(255,255,255,.26);color:#fff;border-color:rgba(255,255,255,.34)}

  /* ---------- masthead panel ---------- */
  header.mast{
    margin-top:26px;padding:38px 40px 34px;color:#fff;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--r-panel);
    box-shadow:0 10px 30px rgba(28,34,42,.12);
  }
  header.mast h1{font-size:54px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.01em}
  header.mast h2{
    display:inline-block;margin:14px 0 0;font-size:20px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:#2f3a44;
    background:rgba(251,248,241,.88);
    padding:6px 18px;border-radius:999px;
  }
  header.mast p.tagline{
    display:inline-block;margin:18px 0 0;font-size:18.5px;color:#fffdf8;font-style:italic;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);
    padding:10px 18px;border-radius:14px;max-width:60ch;
  }
  @media(max-width:620px){
    header.mast{padding:28px 22px 26px}
    header.mast h1{font-size:36px}
    header.mast h2{font-size:16px;letter-spacing:.18em}
    header.mast p.tagline{font-size:16.5px}
  }

  /* ---------- tile grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
  @media(max-width:760px){.grid{grid-template-columns:1fr;gap:20px}}

  .tile{
    background:var(--tile);
    border-radius:var(--r-tile);
    padding:26px 26px 22px;
    box-shadow:var(--shadow);
    text-decoration:none;color:inherit;display:block;
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
    border-top:3px solid var(--accent);
  }
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);background:var(--tile-hover)}
  .tile h3{margin:0;font-size:23px;font-weight:700;line-height:1.25;text-align:left}
  .tile .tags{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
  .chip{
    font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
    background:var(--chip);color:var(--chip-ink);
    padding:4px 12px;border-radius:999px;white-space:nowrap;
  }
  .chip.year{background:var(--chip-year);color:#33414d}
  .tile .preview{margin:15px 0 0;font-size:16.5px;color:var(--ink-soft);line-height:1.5}
  .tile .preview b{color:var(--ink);font-weight:700}
  .tile .date{
    margin:14px 0 0;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;color:#9a8f7d;
    border-top:1px solid var(--rule);padding-top:11px;
  }

  /* ---------- deals page ---------- */
  .search-row{margin-top:28px}
  .search-row input{
    width:100%;max-width:520px;font-family:var(--serif);font-size:18px;
    padding:13px 20px;border:none;border-radius:999px;background:var(--tile);
    color:var(--ink);box-shadow:var(--shadow);
  }
  .search-row input:focus{outline:2px solid rgba(255,255,255,.55);outline-offset:3px}

  .deal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  @media(max-width:860px){.deal-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){.deal-grid{grid-template-columns:1fr}}
  .deal-tile{
    background:var(--tile);border-radius:var(--r-tile);padding:22px 22px;
    box-shadow:var(--shadow);text-decoration:none;color:inherit;
    transition:transform .16s ease, box-shadow .16s ease;
    display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--accent);
  }
  .deal-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .deal-tile .name{font-size:21px;font-weight:700;line-height:1.25}
  .deal-tile .count{font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:#9a8f7d}

  /* ---------- post view ---------- */
  article.post{
    background:var(--tile);border-radius:var(--r-panel);box-shadow:var(--shadow);
    padding:48px 52px 54px;margin-top:30px;border-top:3px solid var(--accent);
  }
  @media(max-width:620px){article.post{padding:30px 24px 36px}}
  article.post h1.title{font-size:36px;line-height:1.18;margin:0 0 14px}
  article.post .meta{font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:#9a8f7d}
  article.post .tags{margin-top:14px}
  article.post .body{
    margin-top:26px;border-top:1px solid var(--rule);padding-top:26px;
    font-size:18.5px;line-height:1.68;
  }
  article.post .body h2{font-size:25px;margin:34px 0 10px}
  article.post .body h3{font-size:20.5px;margin:28px 0 8px}
  article.post .body p{margin:0 0 17px}
  article.post .body ul,article.post .body ol{margin:0 0 17px;padding-left:24px}
  article.post .body li{margin:0 0 7px}
  article.post .body a{color:#6d5636}
  article.post .body blockquote{
    margin:0 0 17px;padding:4px 0 4px 18px;border-left:3px solid var(--rule);
    color:var(--ink-soft);font-style:italic;
  }
  article.post .body hr{border:none;border-top:1px solid var(--rule);margin:30px 0}
  article.post .body code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;
    background:#f1ebdd;padding:2px 7px;border-radius:6px;
  }
  article.post .body pre{background:#f1ebdd;padding:16px 18px;border-radius:12px;overflow:auto}
  article.post .body pre code{background:none;padding:0}
  article.post .body table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:16.5px}
  article.post .body th,article.post .body td{border:1px solid var(--rule);padding:8px 10px;text-align:left}
  article.post .body th{background:#f1ebdd}

  .back{
    display:inline-block;margin-top:24px;color:#fffdf8;text-decoration:none;
    font-size:14.5px;letter-spacing:.05em;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    padding:8px 16px;border-radius:999px;
  }
  .back:hover{background:rgba(255,255,255,.2)}

  .empty{
    background:var(--tile);border-radius:var(--r-tile);box-shadow:var(--shadow);
    padding:28px;margin-top:26px;color:var(--ink-soft);font-size:17.5px;
  }
  footer.site{
    color:#f2f6f9;font-size:14.5px;margin-top:50px;padding:16px 22px;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r-tile);
  }
</style>
</head>
<body>
<div class="bgtiles" aria-hidden="true"><i></i><i class="warm"></i><i class="deep"></i><i class="warm"></i><i></i><i class="deep"></i></div>
<div class="wrap">
  <nav class="top">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/deals" data-nav="deals">Deals and Trends</a>
  </nav>
  <div id="app"></div>
  <footer class="site">© <span id="yr"></span> Ananaya Jain · RX Desk</footer>
</div>

<script>
/* ============================ tiny markdown ============================ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%;border-radius:12px">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,function(m,c){return "<code>"+c+"</code>";})
    .replace(/\*\*\*([^*]+)\*\*\*/g,"<strong><em>$1</em></strong>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
    .replace(/(^|[^_])_([^_]+)_/g,"$1<em>$2</em>");
}
function md(src){
  var lines = esc(src.replace(/\r\n?/g,"\n")).split("\n");
  var out=[], i=0;
  function flushPara(buf){ if(buf.length) out.push("<p>"+inline(buf.join(" "))+"</p>"); }
  while(i<lines.length){
    var ln = lines[i];
    if(/^\s*$/.test(ln)){ i++; continue; }
    if(/^```/.test(ln)){
      var code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; out.push("<pre><code>"+code.join("\n")+"</code></pre>"); continue;
    }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }
    var h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ var l=h[1].length; out.push("<h"+l+">"+inline(h[2])+"</h"+l+">"); i++; continue; }
    if(/^\s*>\s?/.test(ln)){
      var q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out.push("<blockquote>"+md(q.join("\n"))+"</blockquote>"); continue;
    }
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      var rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells=function(r){return r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return inline(c.trim());});};
      var head=cells(rows[0]); var body=rows.slice(2);
      var t="<table><thead><tr>"+head.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr></thead><tbody>";
      body.forEach(function(r){ t+="<tr>"+cells(r).map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>"; });
      out.push(t+"</tbody></table>"); continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){
      var ordered=/^\s*\d+\.\s+/.test(ln), items=[];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,"")); i++;
        while(i<lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
          items[items.length-1] += " " + lines[i].trim(); i++;
        }
      }
      out.push("<"+(ordered?"ol":"ul")+">"+items.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</"+(ordered?"ol":"ul")+">");
      continue;
    }
    var buf=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+\.)\s)/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    flushPara(buf);
  }
  return out.join("\n");
}

/* ============================ data ============================ */
var POSTS = [];
var isYear = function(t){ return /^\d{4}$/.test(String(t).trim()); };

function fmtDate(d){
  var p = String(d).split("-");
  if(p.length<3) return d;
  var m = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return m[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
}
function chips(tags){
  return '<div class="tags">' + tags.map(function(t){
    return '<span class="chip'+(isYear(t)?' year':'')+'">'+esc(t)+'</span>';
  }).join("") + '</div>';
}
function postTile(p){
  return '<a class="tile" href="#/post/'+encodeURIComponent(p.slug)+'">'
    + '<h3>'+esc(p.title)+'</h3>'
    + chips(p.tags||[])
    + (p.excerpt ? '<p class="preview"><b>Preview:</b> '+esc(p.excerpt)+'</p>' : '')
    + (p.date ? '<p class="date">'+fmtDate(p.date)+'</p>' : '')
    + '</a>';
}

/* ============================ views ============================ */
function viewHome(){
  var tiles = POSTS.length
    ? '<div class="grid">'+POSTS.map(postTile).join("")+'</div>'
    : '<div class="empty">No posts published yet.</div>';
  return ''
    + '<header class="mast">'
    +   '<h1>Ananaya Jain</h1>'
    +   '<div><h2>RX Desk</h2></div>'
    +   '<div><p class="tagline">Take a look at restructuring updates and my market opinions!</p></div>'
    + '</header>'
    + tiles;
}

function dealIndex(){
  var map = {};
  POSTS.forEach(function(p){
    (p.tags||[]).forEach(function(t){
      if(isYear(t)) return;
      var k = t.trim();
      if(!map[k]) map[k] = 0;
      map[k]++;
    });
  });
  return Object.keys(map).sort(function(a,b){ return a.localeCompare(b); })
    .map(function(k){ return {name:k, count:map[k]}; });
}
function dealGridHTML(deals, query){
  return deals.length
    ? '<div class="deal-grid">'+deals.map(function(d){
        return '<a class="deal-tile" href="#/deal/'+encodeURIComponent(d.name)+'">'
          + '<span class="name">'+esc(d.name)+'</span>'
          + '<span class="count">'+d.count+' post'+(d.count===1?'':'s')+'</span>'
          + '</a>';
      }).join("")+'</div>'
    : '<div class="empty">No deals or trends match “'+esc(query||"")+'”.</div>';
}

function viewDeals(query){
  var q = (query||"").trim().toLowerCase();
  var deals = dealIndex();
  if(q) deals = deals.filter(function(d){ return d.name.toLowerCase().indexOf(q) !== -1; });
  return ''
    + '<header class="mast">'
    +   '<h1>Deals and Trends</h1>'
    +   '<div><p class="tagline">Search for deals and trends to find my historical and ongoing discussions</p></div>'
    + '</header>'
    + '<div class="search-row"><input id="dealSearch" type="search" placeholder="Search a deal or trend — Altice, LifeScan, LME…" autocomplete="off" value="'+esc(query||"")+'"></div>'
    + dealGridHTML(deals, query);
}

function viewDeal(name){
  var matches = POSTS.filter(function(p){
    return (p.tags||[]).some(function(t){ return t.trim().toLowerCase() === name.toLowerCase(); });
  });
  var body = matches.length
    ? '<div class="grid">'+matches.map(postTile).join("")+'</div>'
    : '<div class="empty">No posts tagged “'+esc(name)+'” yet.</div>';
  return ''
    + '<header class="mast">'
    +   '<h1>'+esc(name)+'</h1>'
    +   '<div><p class="tagline">'+matches.length+' post'+(matches.length===1?'':'s')+' tagged '+esc(name)+'.</p></div>'
    + '</header>'
    + body
    + '<a class="back" href="#/deals">← All deals and trends</a>';
}

function viewPost(slug){
  var p = POSTS.filter(function(x){ return x.slug === slug; })[0];
  if(!p){
    return '<header class="mast"><h1>Not found</h1></header>'
      + '<div class="empty">That post doesn’t exist.</div>'
      + '<a class="back" href="#/">← Back to RX Desk</a>';
  }
  return ''
    + '<article class="post">'
    +   '<h1 class="title">'+esc(p.title)+'</h1>'
    +   (p.date ? '<div class="meta">'+fmtDate(p.date)+'</div>' : '')
    +   chips(p.tags||[])
    +   '<div class="body">'+md(p.body||"")+'</div>'
    + '</article>'
    + '<a class="back" href="#/">← Back to RX Desk</a>';
}

/* ============================ router ============================ */
function route(){
  var h = location.hash.replace(/^#/,"") || "/";
  var app = document.getElementById("app");
  var nav = {home:false, deals:false};
  var html;

  if(h.indexOf("/post/") === 0){
    html = viewPost(decodeURIComponent(h.slice(6)));
    nav.home = true;
  } else if(h.indexOf("/deal/") === 0){
    html = viewDeal(decodeURIComponent(h.slice(6)));
    nav.deals = true;
  } else if(h.indexOf("/deals") === 0){
    var qi = h.indexOf("?q=");
    html = viewDeals(qi > -1 ? decodeURIComponent(h.slice(qi+3)) : "");
    nav.deals = true;
  } else {
    html = viewHome();
    nav.home = true;
  }

  app.innerHTML = html;
  document.querySelectorAll("nav.top a").forEach(function(a){
    a.classList.toggle("active", !!nav[a.dataset.nav]);
  });

  var s = document.getElementById("dealSearch");
  if(s){
    var pos = s.value.length;
    s.focus(); try{ s.setSelectionRange(pos,pos); }catch(e){}
    s.addEventListener("input", function(){
      var v = s.value;
      history.replaceState(null,"","#/deals" + (v ? "?q="+encodeURIComponent(v) : ""));
      var deals = dealIndex().filter(function(d){
        return !v.trim() || d.name.toLowerCase().indexOf(v.trim().toLowerCase()) !== -1;
      });
      var holder = document.getElementById("app").querySelector(".deal-grid, .empty");
      if(holder) holder.outerHTML = dealGridHTML(deals, v);
    });
  }
  if(h.indexOf("/deals") !== 0) window.scrollTo(0,0);
}

window.addEventListener("hashchange", route);
document.getElementById("yr").textContent = new Date().getFullYear();

fetch("posts.json?v="+Date.now())
  .then(function(r){ return r.ok ? r.json() : []; })
  .then(function(data){
    POSTS = (data||[]).filter(function(p){ return !p.draft; });
    POSTS.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    route();
  })
  .catch(function(){ route(); });
</script>
</body>
</html>
